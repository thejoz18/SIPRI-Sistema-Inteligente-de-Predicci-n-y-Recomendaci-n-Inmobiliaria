services:
  - type: web
    name: valuo-sipri
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn valuo_sipri.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: valuo-sipri-db
          property: connectionString
    disk:
      name: valuo-sipri-data
      mountPath: /var/data
      sizeGB: 1
databases:
  - name: valuo-sipri-db
    databaseName: valuo_sipri
    user: valuo_sipri
