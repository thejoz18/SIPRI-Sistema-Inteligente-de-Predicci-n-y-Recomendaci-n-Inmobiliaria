services:
  - type: web
    name: valuo-sipri
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn valuo_sipri.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FREE_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: valuo-sipri-db
          property: connectionString
databases:
  - name: valuo-sipri-db
    plan: free
    databaseName: valuo_sipri
    user: valuo_sipri
    ipAllowList: []
